<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Therapists | Soul Sync</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">S</span><span>Soul Sync</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="mood.html">Mood</a><a href="journal.html">Journal</a><a href="resources.html">Resources</a><a href="therapists.html">Therapists</a><a href="crisis.html">Crisis</a><a href="profile.html">Profile</a>
      </nav>
    </header>
    <main class="container">
      <section class="page-head">
        <div>
          <p class="eyebrow">Professional support</p>
          <h1>Therapists</h1>
          <p>Explore available support providers and request a session time that fits your week.</p>
        </div>
      </section>
      <section class="split">
        <div>
          <h2>Available providers</h2>
          <div class="list" id="therapistList" style="margin-top: 16px;"></div>
        </div>
        <form class="form-panel" id="appointmentForm">
          <h2>Book a session</h2>
          <div class="form-grid" style="margin-top: 16px;">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required>
            </div>
            <div class="field">
              <label for="therapist">Therapist</label>
              <select id="therapist" name="therapist" required></select>
            </div>
            <div class="field">
              <label for="sessionType">Session type</label>
              <select id="sessionType" name="sessionType" required>
                <option>Video therapy</option>
                <option>Phone consultation</option>
                <option>In-person therapy</option>
                <option>Wellness coaching</option>
              </select>
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input id="date" name="date" type="date" required>
            </div>
            <div class="field">
              <label for="time">Time</label>
              <input id="time" name="time" type="time" required>
            </div>
            <div class="field full">
              <label for="concern">What would you like support with?</label>
              <textarea id="concern" name="concern"></textarea>
            </div>
          </div>
          <button class="button" type="submit">Request booking</button>
          <p class="status" id="appointmentStatus"></p>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
