<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Soul Sync</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">S</span><span>Soul Sync</span></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="mood.html">Mood</a><a href="journal.html">Journal</a><a href="dreams.html">Dreams</a><a href="resources.html">Resources</a><a href="therapists.html">Therapists</a><a href="crisis.html">Crisis</a><a href="profile.html">Profile</a><a href="auth.html">Login</a>
      </nav>
    </header>
    <main class="container">
      <section class="page-head">
        <div>
          <p class="eyebrow">Your preferences</p>
          <h1>Profile</h1>
          <p>Set personal wellness goals, check-in timing, and privacy preferences.</p>
        </div>
      </section>
      <form class="form-panel" id="profileForm">
        <div class="form-grid">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name">
          </div>
          <div class="field">
            <label for="preferredCheckIn">Preferred check-in</label>
            <select id="preferredCheckIn" name="preferredCheckIn">
              <option>Morning</option>
              <option>Afternoon</option>
              <option>Evening</option>
              <option>Night</option>
            </select>
          </div>
          <div class="field full">
            <label for="goal">Wellness goal</label>
            <input id="goal" name="goal" placeholder="Build healthier routines">
          </div>
          <label class="checkbox-row"><input id="notifications" name="notifications" type="checkbox"> Enable gentle reminders</label>
          <label class="checkbox-row"><input id="privacyMode" name="privacyMode" type="checkbox"> Keep private mode on</label>
        </div>
        <button class="button" type="submit">Save profile</button>
        <p class="status" id="profileStatus"></p>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
