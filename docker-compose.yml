version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: soulsync_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soulsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: soulsync_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soulsync_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soulsync
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_soulsync_key_for_jwt_tokens_change_in_production
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soulsync_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api

volumes:
  postgres_data:
